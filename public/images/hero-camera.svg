<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 300 500 600" role="img">

<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e4ded4"/>
    <stop offset="1" stop-color="#c9c2b6"/>
  </linearGradient>
  
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" result="n"/>
  <feColorMatrix in="n" type="saturate" values="0" result="g"/>
  <feComponentTransfer in="g" result="a">
    <feFuncA type="linear" slope="0.22"/>
  </feComponentTransfer>
  <feBlend in="SourceGraphic" in2="a" mode="multiply"/>
</filter>

</defs>
<g filter="url(#grain)">
  <rect width="640" height="900" fill="url(#wall)"/>
